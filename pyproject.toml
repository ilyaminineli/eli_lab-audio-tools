[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eli-lab-audio-tools"
version = "0.3.0"
description = "Free audio utilities including Eugene:RE timbre analysis and conservative restoration."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "soundfile>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
eugene-timbre = "eugene_timbre.cli:main"

[tool.setuptools.packages.find]
include = ["eugene_timbre*"]
