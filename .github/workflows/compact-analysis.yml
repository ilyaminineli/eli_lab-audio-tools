name: Build compact Eugene analysis profile

on:
  push:
    branches:
      - feature/eugene-analysis-profiles
    paths-ignore:
      - "analysis_profiles/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compact-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out analysis repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install extraction and test dependencies
        run: python -m pip install --upgrade numpy pytest scipy soundfile
      - name: Test feature extractor and routing chain
        run: pytest -q tests/test_extract_voicebank_profile.py tests/test_auto_processing_chain.py
      - name: Extract compact processing features
        run: >-
          python tools/extract_voicebank_profile.py
          --pitch-reports B2_analysis.json F3_analysis.json G4_analysis.json
          --full-bank EugeneRE_analysis.json
          --supplemental CONSONANT_analysis.json BONUS_analysis.json L_analysis.json
          V_analysis.json TH_analysis.json "R ENGLISH_analysis.json"
          --output analysis_profiles/EugeneRE_compact_profile.json
      - name: Commit compact profile to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_profiles/EugeneRE_compact_profile.json
          if git diff --cached --quiet; then
            echo "Compact profile unchanged."
          else
            git commit -m "Build compact Eugene processing feature profile"
            git push
          fi
